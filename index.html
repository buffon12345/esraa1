<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إسراء ❤️ أحمد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body {
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
  background-size: 800% 800%;
  animation: gradientBG 15s ease infinite;
  color: #000;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* شريط أبيات الشعر */
.poem-bar {
  position: fixed;
  top: 0;
  width: 100%;
  background-color: rgba(255,255,255,0.8);
  white-space: nowrap;
  overflow: hidden;
  height: 35px;
  display: flex;
  align-items: center;
  font-weight: bold;
}

.poem-text {
  display: inline-block;
  padding-left: 100%;
  animation: scrollPoem 20s linear infinite;
  font-size: 1.2em;
  color: #000;
}

@keyframes scrollPoem {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

h1 {
  font-size: 3em;
  margin-top: 50px; /* لتجنب التداخل مع شريط الشعر */
}

.name {
  font-size: 2em; /* حجم مناسب للموبايل */
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
  color: yellow;
}

.heart {
  font-size: 2em; /* حجم مناسب للقلب */
  color: red;
  animation: beat 1s infinite;
  margin: 0 10px;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.4); }
}

.message {
  font-size: 1.5em;
  margin-bottom: 15px;
}

.stars {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  animation: starAnim 5s linear infinite;
}

@keyframes starAnim {
  0% {transform: translateY(0) translateX(0);}
  100% {transform: translateY(-100vh) translateX(100vw);}
}

.image-container img {
  width: 200px;
  margin-top: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  animation: floatImg 4s ease-in-out infinite;
}

@keyframes floatImg {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
</style>
</head>
<body>

<!-- شريط أبيات الشعر -->
<div class="poem-bar">
  <div class="poem-text">
    "أحبك يا إسراء ❤️ أحمد، كل يوم قلبي لكم يزداد شوقًا • أنتم قمري ونجم الليالي • لا شيء في العالم يضاهي جمالكم • معكم الحياة تحلو وتشرق."
  </div>
</div>

<h1><span class="name">إسراء</span> <span class="heart">❤️</span> <span class="name">أحمد</span></h1>

<div id="messages-container"></div>

<div class="image-container">
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Sunrise_over_the_hills.jpg" alt="صورة جميلة">
</div>

<script>
// توليد نجوم عشوائية
for (let i = 0; i < 50; i++) {
  let star = document.createElement("div");
  star.classList.add("stars");
  star.style.top = Math.random() * window.innerHeight + "px";
  star.style.left = Math.random() * window.innerWidth + "px";
  star.style.width = star.style.height = Math.random()*3 + "px";
  document.body.appendChild(star);
}

// عرض الرسائل واحدة وراء الأخرى
const messages = [
  "انت مميز وعزيز على قلبي",
  "كل يوم بحسك أقرب لي",
  "وجودك بيخليني سعيد",
  "يارب يومك يكون جميل",
  "أنتِ فرحتي وسعادتي"
];

const container = document.getElementById("messages-container");
let index = 0;

function showNextMessage() {
  container.textContent = ""; // مسح الرسالة القديمة
  if(index < messages.length){
    const msg = document.createElement("p");
    msg.className = "message";
    msg.textContent = messages[index];
    container.appendChild(msg);
    index++;
    setTimeout(showNextMessage, 2000); // تظهر كل رسالة 2 ثانية
  }
}

// تشغيل بعد تحميل الصفحة
window.onload = showNextMessage;
</script>

</body>
</html>
